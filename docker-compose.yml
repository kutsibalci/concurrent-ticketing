# Credentials come from .env — see .env.example. Compose refuses to start rather than
# falling back to a default, because a default is how a weak password reaches a real host.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seatreservation}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli degil, .env olusturun}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published. Only the API needs to reach the database, and it does so over the
    # compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-seatreservation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD tanimli degil, .env olusturun}
    ports:
      # Management UI only, bound to loopback. The AMQP port stays on the compose network.
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      # Only the mnesia directory, not the whole of /var/lib/rabbitmq. Mounting the parent
      # hides the .erlang.cookie the image ships and the container fails to start with
      # "Error when reading /var/lib/rabbitmq/.erlang.cookie: eacces".
      - rabbitmq_data:/var/lib/rabbitmq/mnesia
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/SeatReservation.Api/Dockerfile
    restart: unless-stopped
    ports:
      # Configurable: 8080 is a popular port and a fixed one collides with whatever else
      # the machine happens to be running.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-seatreservation};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY tanimli degil, .env olusturun}
      Reservation__HoldDuration: ${HOLD_DURATION:-00:10:00}
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: src/SeatReservation.Worker/Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-seatreservation};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      # The worker issues no tokens; the value only satisfies the shared startup validation.
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      RabbitMq__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Waits for the API so the schema exists before the consumer touches it: migrations
      # run on API startup, and two processes racing to apply them is not worth the risk.
      api:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
